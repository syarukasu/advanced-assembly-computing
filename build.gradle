plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group
version = mod_version

base {
    archivesName = 'advanced-assembly-computing'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'Registrate releases'
        url = uri('https://maven.gegy.dev/releases')
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        advanced_assembly_computing {
            sourceSet(sourceSets.main)
        }
    }

    addModdingDependenciesTo sourceSets.test
}

dependencies {
    def localModsDir = file(findProperty('aacLocalModsDir') ?: '../../mods')
    def requiredMod = { String fileName ->
        File dependency = new File(localModsDir, fileName)
        if (!dependency.isFile()) {
            throw new GradleException("Required 1.21.1 dependency is missing: ${dependency}")
        }
        dependency
    }

    implementation files(requiredMod('appliedenergistics2-19.2.17.jar'))
    implementation files(requiredMod('guideme-21.1.17.jar'))
    implementation files(requiredMod('neoecoae-21.1.1.jar'))
    implementation files(requiredMod('ldlib2-neoforge-1.21.1-2.2.32-all.jar'))
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21.1-1.4.8'

    def acoJar = file('../ae2-crafting-optimizer-src/build/libs/ae2-crafting-optimizer-1.6.1.jar')
    if (!acoJar.isFile()) {
        throw new GradleException("Required ACO 1.21.1 build is missing: ${acoJar}")
    }
    compileOnly files(acoJar)
    testImplementation files(acoJar)

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE') {
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : 'syaru',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'syaru',
                'Implementation-License' : 'GPL-3.0-only',
                'MixinConfigs'            : 'advanced_assembly_computing.mixins.json'
        ])
    }
}
