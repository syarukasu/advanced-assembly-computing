plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group
version = mod_version

def expectedMinecraftVersion = '1.20.1'
if (minecraft_version != expectedMinecraftVersion) {
    throw new GradleException(
            "The Forge AAC build must target ${expectedMinecraftVersion}, got ${minecraft_version}")
}

def ae2Variant = (findProperty('ae2Variant') ?: 'upstream').toString().toLowerCase(Locale.ROOT)
def ae2Profiles = [
        upstream: [version: '15.4.10', localFile: 'appliedenergistics2-forge-15.4.10.jar'],
        uelm: [version: '15.5.0-uelm', localFile: 'appliedenergistics2-forge-15.5.0-uelm.jar']
]
if (!ae2Profiles.containsKey(ae2Variant)) {
    throw new GradleException("Unsupported ae2Variant '${ae2Variant}'. Use upstream or uelm.")
}
def ae2Profile = ae2Profiles[ae2Variant]

base {
    archivesName = "aac${mod_version}_${minecraft_version}"
}

tasks.named('jar') {
    archiveFileName = "aac${mod_version}_${minecraft_version}.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                advanced_assembly_computing {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                advanced_assembly_computing {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
    // 再難読化済みACO配布JARをForgeGradleのdeobf対象として解決する。
    def acoJarProperty = findProperty('acoJar')
    dirs(acoJarProperty == null ? file("${buildDir}/aco-contract") : file(acoJarProperty).parentFile)
    }
    maven {
        name = 'ExpandiumReleases'
        url = 'https://repo.expandium.net/releases'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'FirstDarkDev'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    if (findProperty('aacMetadataOnly') != 'true') {
    def localModsDir = file(findProperty('aacLocalModsDir') ?: '../../mods')
    def ae2JarProperty = findProperty('ae2Jar')
    def localAe2 = ae2JarProperty == null
            ? new File(localModsDir, ae2Profile.localFile)
            : file(ae2JarProperty)
    // 有効JARとランチャーが無効化したJARのどちらからでも、検証済みNeo ECO 20.4.0を解決する。
    def localNeoEco = [
        new File(localModsDir, 'neoecoae-20.4.0.jar'),
        new File(localModsDir, 'neoecoae-20.4.0.jar.disabled')
    ].find { it.isFile() }
    def localLdlib = new File(localModsDir, 'ldlib-forge-1.20.1-1.0.50.jar')
    def acoJarProperty = findProperty('acoJar')
    if (acoJarProperty == null) {
        throw new GradleException('AAC 1.20.1 requires -PacoJar=/absolute/path/to/aco<version>_1.20.1.jar')
    }
    def localAco = file(acoJarProperty)
    def acoStem = localAco.name.endsWith('.jar') ? localAco.name[0..-5] : localAco.name
    def acoVersionMatcher = (acoStem =~ /(?:-|^aco)(\d+\.\d+\.\d+)(?:_|$)/)
    if (!acoVersionMatcher.find()) {
        throw new GradleException("ACO contract JAR must use a versioned filename: ${localAco}")
    }
    def acoVersion = acoVersionMatcher.group(1)
    // Resolve the exact file supplied by the caller. This also supports the
    // new aco<version>_<minecraft>.jar name without a legacy fixed filename.
    def localAcoDependency = project.dependencies.create(files(localAco))

    // 必須の検証済みArtifactが一つでも欠ける場合は、推測したAPIでビルドを続行しない。
    if ((ae2Variant == 'upstream' && !localAe2.isFile())
            || localNeoEco == null || !localLdlib.isFile() || !localAco.isFile()) {
        throw new GradleException(
                'AAC requires the selected AE2 profile, exact Neo ECO, LDLib, and explicit ACO contract artifacts documented by this project.')
    }

    def acoArchive = new java.util.jar.JarFile(localAco)
    try {
        def metadataEntry = acoArchive.getJarEntry('META-INF/mods.toml')
        if (metadataEntry == null) {
            throw new GradleException("ACO contract JAR is not a Forge 1.20.1 artifact: ${localAco}")
        }
        def metadata = acoArchive.getInputStream(metadataEntry).getText('UTF-8')
        def acoMetadataVersionMatcher =
                metadata =~ /(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$/
        def hasMinecraft20Dependency =
                (metadata =~ /(?s)modId\s*=\s*"minecraft".*?versionRange\s*=\s*"\[1\.20\.1,1\.20\.2\)"/).find()
        if (!metadata.contains('modId = "ae2_crafting_optimizer"')
                || !acoMetadataVersionMatcher.find()
                || acoMetadataVersionMatcher.group(1) != acoVersion
                || !hasMinecraft20Dependency) {
            throw new GradleException("ACO contract JAR has unexpected 1.20.1 metadata: ${localAco}")
        }
    } finally {
        acoArchive.close()
    }

    if (localAe2.isFile()) {
        implementation files(localAe2)
    } else {
        implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2Profile.version}")
    }
    implementation files(localNeoEco)
    compileOnly files(localLdlib)
    /*
     * ACOの配布JARは再難読化済みなので、開発・単体試験ではForgeGradleに
     * Minecraft参照を公式Mappingsへ戻させる。
     */
    compileOnly fg.deobf(localAcoDependency)
    // Exact Vector Receiptの単体試験でも、配布時と同じACO API v4を使用する。
    testImplementation fg.deobf(localAcoDependency)
    compileOnly 'com.tterrag.registrate:Registrate:MC1.20-1.3.3'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    }
}

tasks.register('verifyAacPlatformConfiguration') {
    description = 'Verify the Forge 1.20.1 source and release naming boundary without resolving mod dependencies.'
    group = 'verification'
    doLast {
        def metadata = file('src/main/resources/META-INF/mods.toml').getText('UTF-8')
        if (!metadata.contains('modId = "advanced_assembly_computing"')
                || !metadata.contains('modId = "forge"')
                || !metadata.contains('versionRange = "[1.20.1,1.20.2)"')
                || metadata.contains('neoforge.mods.toml')
                || metadata.contains('1.21.1')) {
            throw new GradleException('Forge 1.20.1 metadata boundary is invalid')
        }
        def platformFiles = fileTree('src/main/resources/META-INF').files*.name
        if (platformFiles != ['mods.toml']) {
            throw new GradleException("Forge source must contain only mods.toml, got ${platformFiles}")
        }
        def forbiddenSource = fileTree('src/main/java').matching {
            include '**/*.java'
        }.files.findAll { source ->
            source.getText('UTF-8').contains('net.neoforged')
        }
        if (!forbiddenSource.isEmpty()) {
            throw new GradleException("Forge source contains NeoForge references: ${forbiddenSource}")
        }
        def expectedName = "aac${mod_version}_1.20.1.jar"
        if (base.archivesName.get() != expectedName[0..-5]) {
            throw new GradleException("Unexpected Forge archive base name: ${base.archivesName.get()}")
        }
    }
}

tasks.register('verifyAcoPublicApiBoundary') {
    description = 'Reject direct AAC imports from ACO implementation packages.'
    group = 'verification'
    doLast {
        def forbidden = ~/import\s+com\.syaru\.ae2craftingoptimizer\.(?!api\.)/
        fileTree('src/main/java').matching { include '**/*.java' }.files.each { source ->
            def text = source.getText('UTF-8')
            if (text =~ forbidden) {
                throw new GradleException("AAC source imports a non-public ACO package: ${source}")
            }
        }
    }
}

tasks.register('verifyOptionalAqeResourceContract') {
    description = 'Verify AQE-optional Forge recipes, or also validate an explicitly supplied AQE artifact.'
    group = 'verification'
    doLast {
        def expectedRecipeNames = [
                'vector_crafting_controller.json',
                'vector_crafting_parallel_core.json',
                'vector_crafting_worker.json'
        ] as Set
        def recipeDirectory = file(
                'src/main/resources/data/advanced_assembly_computing/recipes')
        def expectedRecipes = expectedRecipeNames.collect {
            new File(recipeDirectory, it)
        }
        def parser = new groovy.json.JsonSlurper()

        // AQE非導入時もresource reloadでJSON構文に失敗しないよう全配布JSONを解析する。
        fileTree('src/main/resources').matching { include '**/*.json' }.files.each { resource ->
            parser.parseText(resource.getText('UTF-8'))
        }

        // AQE item IDを含むrecipeは三つのForge条件付きrecipeだけに限定する。
        def aqeReferences = fileTree('src/main/resources').matching {
            include '**/*.json'
        }.files.findAll { resource ->
            resource.getText('UTF-8').contains('advanced_quantum_engineering:')
        } as Set
        if (aqeReferences != expectedRecipes as Set) {
            throw new GradleException(
                    "AQE references escaped the optional recipe boundary: ${aqeReferences}")
        }

        // 各AQE recipeがForgeのmod_loaded条件で一件だけを包んでいることを検証する。
        expectedRecipes.each { recipe ->
            def root = parser.parseText(recipe.getText('UTF-8'))
            def wrapped = root.recipes
            if (root.type != 'forge:conditional'
                    || !(wrapped instanceof List)
                    || wrapped.size() != 1
                    || wrapped[0].conditions?.size() != 1
                    || wrapped[0].conditions[0].type != 'forge:mod_loaded'
                    || wrapped[0].conditions[0].modid != 'advanced_quantum_engineering'
                    || !(wrapped[0].recipe instanceof Map)) {
                throw new GradleException(
                        "AQE recipe is not safely Forge-conditional: ${recipe}")
            }
        }

        def aqeJarProperty = findProperty('aqeJar')
        // -PaqeJar未指定はAQEなしの契約検査として正常終了する。
        if (aqeJarProperty == null) {
            logger.lifecycle('AAC optional AQE resources verified without AQE')
            return
        }

        File aqeJar = file(aqeJarProperty)
        if (!aqeJar.isFile()) {
            throw new GradleException("Optional AQE artifact is missing: ${aqeJar}")
        }
        def requiredModels = [
                'assets/advanced_quantum_engineering/models/item/big_integer_quantum_core.json',
                'assets/advanced_quantum_engineering/models/item/modified_quantum_accelerator.json',
                'assets/advanced_quantum_engineering/models/item/modified_quantum_multi_threader.json',
                'assets/advanced_quantum_engineering/models/item/modified_quantum_storage.json'
        ] as Set
        def archive = new java.util.jar.JarFile(aqeJar)
        try {
            def metadataEntry = archive.getJarEntry('META-INF/mods.toml')
            if (metadataEntry == null
                    || archive.getJarEntry('META-INF/neoforge.mods.toml') != null) {
                throw new GradleException(
                        "AQE artifact is not Forge 1.20.1: ${aqeJar}")
            }
            def metadata = archive.getInputStream(metadataEntry).getText('UTF-8')
            if (!metadata.contains('modId = "advanced_quantum_engineering"')
                    || !metadata.contains('versionRange = "[1.20.1,1.20.2)"')) {
                throw new GradleException(
                        "AQE artifact has unexpected Minecraft metadata: ${aqeJar}")
            }
            def entries = archive.entries().collect { it.name } as Set
            if (!entries.containsAll(requiredModels)) {
                throw new GradleException(
                        "AQE artifact is missing AAC recipe materials: ${requiredModels - entries}")
            }
        } finally {
            archive.close()
        }
        logger.lifecycle("AAC optional AQE resources verified with ${aqeJar.name}")
    }
}

tasks.register('verifyAe2DependencyProfiles') {
    description = 'Verify the selected AE2 replacement profile and reject private AE2 imports.'
    group = 'verification'
    doLast {
        if (findProperty('aacMetadataOnly') == 'true') {
            return
        }
        def expectedVersion = "${ae2Profile.version}.jar"
        def selected = configurations.compileClasspath.resolve().findAll {
            it.name.startsWith('appliedenergistics2-forge-')
        }
        def selectedName = selected ? selected[0].name : ''
        def selectedVersion = selectedName
                .replaceFirst(/^appliedenergistics2-forge-/, '')
                .replaceFirst(/_mapped_official_1\.20\.1\.jar$/, '.jar')
        if (selected.size() != 1 || selectedVersion != expectedVersion) {
            throw new GradleException(
                    "AE2 profile '${ae2Variant}' selected ${selected*.name}; expected version [${expectedVersion}]")
        }

        // CraftingService is an existing AE2 15.4.10/UELM shared integration
        // surface used by AAC's CPU-priority output path. Keep that behavior
        // intact; reject only private fork-specific packages.
        def privateAe2Import = ~/import\s+appeng\.(?:core|client|integration|hooks|network|uelm)\./
        fileTree('src/main/java').matching { include '**/*.java' }.files.each { source ->
            if (source.getText('UTF-8') =~ privateAe2Import) {
                throw new GradleException("AAC source imports a private AE2 package: ${source}")
            }
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('verifyAcoPublicApiBoundary')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyAe2DependencyProfiles')
    dependsOn tasks.named('verifyOptionalAqeResourceContract')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'aacLocalModsDir', findProperty('aacLocalModsDir') ?: ''
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    // 配布JAR内のMinecraft参照を、本番環境で使われる難読化名へ必ず変換する。
    finalizedBy 'reobfJar'
    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE') {
        into 'META-INF'
    }
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'syaru',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'syaru',
            'Implementation-License': 'GPL-3.0-only',
            'MixinConfigs': 'advanced_assembly_computing.mixins.json'
        ])
    }
}

tasks.register('normalizeReobfJarName') {
    dependsOn 'reobfJar'
    doLast {
        def expected = file("$buildDir/libs/aac${mod_version}_${minecraft_version}.jar")
        def sources = fileTree("$buildDir/libs").matching {
            include "aac${mod_version}_${minecraft_version}-*.jar"
        }.files
        def source = sources.find { it.name != expected.name }
        if (source != null && source.exists()) {
            if (!source.renameTo(expected)) {
                throw new GradleException("Could not normalize ${source.name} to ${expected.name}")
            }
        }
        if (!expected.isFile()) {
            throw new GradleException("Expected distribution JAR was not produced: ${expected}")
        }
    }
}

tasks.register('verifyAacArtifactBoundary') {
    description = 'Verify the Forge 1.20.1 artifact name, metadata, and bytecode boundary.'
    group = 'verification'
    dependsOn 'normalizeReobfJarName'
    doLast {
        def expected = file("$buildDir/libs/aac${mod_version}_${minecraft_version}.jar")
        if (!expected.isFile()) {
            throw new GradleException("Expected AAC artifact is missing: ${expected}")
        }
        if (!(expected.name == "aac${mod_version}_1.20.1.jar")) {
            throw new GradleException("Artifact is not Minecraft-qualified: ${expected.name}")
        }

        def classVersions = [] as Set
        def entries = []
        def archive = new java.util.jar.JarFile(expected)
        try {
            archive.entries().each { entry ->
                entries << entry.name
                if (entry.name.endsWith('.class')) {
                    def bytes = new byte[8]
                    def input = archive.getInputStream(entry)
                    try {
                        if (input.read(bytes) != 8
                                || bytes[0] != (byte) 0xCA
                                || bytes[1] != (byte) 0xFE
                                || bytes[2] != (byte) 0xBA
                                || bytes[3] != (byte) 0xBE) {
                            throw new GradleException("Invalid class header in ${entry.name}")
                        }
                        classVersions << ((bytes[6] & 0xFF) << 8 | (bytes[7] & 0xFF))
                    } finally {
                        input.close()
                    }
                }
            }
            def metadataEntry = archive.getJarEntry('META-INF/mods.toml')
            if (metadataEntry == null || archive.getJarEntry('META-INF/neoforge.mods.toml') != null) {
                throw new GradleException('Forge artifact must contain only META-INF/mods.toml')
            }
            def metadata = archive.getInputStream(metadataEntry).getText('UTF-8')
            if (!metadata.contains('modId = "advanced_assembly_computing"')
                    || !metadata.contains('versionRange = "[1.20.1,1.20.2)"')
                    || metadata.contains('1.21.1')) {
                throw new GradleException('AAC artifact contains unexpected Forge metadata')
            }
        } finally {
            archive.close()
        }

        def forbiddenEntries = entries.findAll {
            it.startsWith('net/neoforged/')
                    || it == 'META-INF/neoforge.mods.toml'
                    || it.contains('1.21.1')
        }
        if (!forbiddenEntries.isEmpty()) {
            throw new GradleException("AAC 1.20.1 artifact contains 1.21.1 entries: ${forbiddenEntries}")
        }
        if (classVersions != [61] as Set) {
            throw new GradleException("AAC 1.20.1 artifact must use Java 17 bytecode, got ${classVersions}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyAacArtifactBoundary'
}
