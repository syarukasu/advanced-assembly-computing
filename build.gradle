plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group
version = mod_version

base {
    archivesName = "aac${mod_version}_${minecraft_version}"
}

tasks.named('jar') {
    archiveFileName = "aac${mod_version}_${minecraft_version}.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                advanced_assembly_computing {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                advanced_assembly_computing {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
        // 再難読化済みACO配布JARをForgeGradleのdeobf対象として解決する。
        def acoJarProperty = findProperty('acoJar')
        dirs(acoJarProperty == null ? file("${buildDir}/aco-contract") : file(acoJarProperty).parentFile)
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'FirstDarkDev'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'

    def localModsDir = file(findProperty('aacLocalModsDir') ?: '../../mods')
    def localAe2 = new File(localModsDir, 'appliedenergistics2-forge-15.4.10.jar')
    // 有効JARとランチャーが無効化したJARのどちらからでも、検証済みNeo ECO 20.3.0を解決する。
    def localNeoEco = [
        new File(localModsDir, 'neoecoae-20.3.0.jar'),
        new File(localModsDir, 'neoecoae-20.3.0.jar.disabled')
    ].find { it.isFile() }
    def localLdlib = new File(localModsDir, 'ldlib-forge-1.20.1-1.0.50.jar')
    def acoJarProperty = findProperty('acoJar')
    if (acoJarProperty == null) {
        throw new GradleException('AAC 1.20.1 requires -PacoJar=/absolute/path/to/aco<version>_1.20.1.jar')
    }
    def localAco = file(acoJarProperty)
    def acoStem = localAco.name.endsWith('.jar') ? localAco.name[0..-5] : localAco.name
    def acoVersionSeparator = acoStem.lastIndexOf('-')
    if (acoVersionSeparator <= 0 || acoVersionSeparator == acoStem.length() - 1) {
        throw new GradleException("ACO contract JAR must use a versioned filename: ${localAco}")
    }
    def acoModuleName = acoStem.substring(0, acoVersionSeparator)
    def acoVersion = acoStem.substring(acoVersionSeparator + 1)
    def localAcoDependency = project.dependencies.create(
            group: 'local.aco',
            name: acoModuleName,
            version: acoVersion)

    // 必須の検証済みArtifactが一つでも欠ける場合は、推測したAPIでビルドを続行しない。
    if (!localAe2.isFile() || localNeoEco == null || !localLdlib.isFile() || !localAco.isFile()) {
        throw new GradleException(
                'AAC requires the exact local AE2, Neo ECO, LDLib, and explicit ACO contract artifacts documented by this project.')
    }

    def acoArchive = new java.util.jar.JarFile(localAco)
    try {
        def metadataEntry = acoArchive.getJarEntry('META-INF/mods.toml')
        if (metadataEntry == null) {
            throw new GradleException("ACO contract JAR is not a Forge 1.20.1 artifact: ${localAco}")
        }
        def metadata = acoArchive.getInputStream(metadataEntry).getText('UTF-8')
        if (!metadata.contains('modId = "ae2_crafting_optimizer"') || !metadata.contains('1.20.1')) {
            throw new GradleException("ACO contract JAR has unexpected 1.20.1 metadata: ${localAco}")
        }
    } finally {
        acoArchive.close()
    }

    implementation files(localAe2)
    implementation files(localNeoEco)
    compileOnly files(localLdlib)
    /*
     * ACOの配布JARは再難読化済みなので、開発・単体試験ではForgeGradleに
     * Minecraft参照を公式Mappingsへ戻させる。
     */
    compileOnly fg.deobf(localAcoDependency)
    // Exact Vector Receiptの単体試験でも、配布時と同じACO API v4を使用する。
    testImplementation fg.deobf(localAcoDependency)
    compileOnly 'com.tterrag.registrate:Registrate:MC1.20-1.3.3'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    // 配布JAR内のMinecraft参照を、本番環境で使われる難読化名へ必ず変換する。
    finalizedBy 'reobfJar'
    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE') {
        into 'META-INF'
    }
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'syaru',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'syaru',
            'Implementation-License': 'GPL-3.0-only',
            'MixinConfigs': 'advanced_assembly_computing.mixins.json'
        ])
    }
}
